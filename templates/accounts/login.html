{% extends 'base.html' %}

{% block title %}Log In - HalluciBench{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-hb p-4">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-lock text-primary fs-1 mb-2"></i>
                    <h3 class="fw-bold text-white mb-1">Log In to HalluciBench</h3>
                    <p class="text-muted small">Access AI model evaluation dashboards and history</p>
                </div>

                <form method="post" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-white fw-medium">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white fw-medium">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary-hb w-100 py-2 mt-2">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                    </button>
                </form>

                <hr class="border-secondary-subtle my-4">
                <div class="text-center">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
