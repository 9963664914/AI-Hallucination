{% extends 'base.html' %}

{% block title %}Change Password - HalluciBench{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card-hb p-4">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-key text-primary fs-1 mb-2"></i>
                    <h3 class="fw-bold text-white mb-1">Change Password</h3>
                    <p class="text-muted small">Update your security credentials</p>
                </div>

                <form method="post" action="{% url 'accounts:password_change' %}">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-white small fw-medium">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary-hb w-100 py-2 mt-3">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
