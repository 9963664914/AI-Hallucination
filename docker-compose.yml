version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-hallucibench-prod-secret-key-change-me
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hallucibench_db
      - DB_USER=hallucibench_user
      - DB_PASSWORD=hallucibench_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-hallucibench-prod-secret-key-change-me
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=hallucibench_db
      - DB_USER=hallucibench_user
      - DB_PASSWORD=hallucibench_pass
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=hallucibench_db
      - POSTGRES_USER=hallucibench_user
      - POSTGRES_PASSWORD=hallucibench_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
